services:
  - type: web
    name: debu-file
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_FILE_SIZE_MB
        value: "500"
    disk:
      name: debu-file-data
      mountPath: /var/data
      sizeGB: 10
